---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost  # Or your build/deployment server
  connection: local

  vars:
    image_name: mariembenamor/my-app
    image_tag: 7
    dockerfile_path: './'
    # docker_registry_username: mariembenamor
    # docker_registry_password: dockerhup-9
  
  vars_files:
    - vault.yml

  tasks:
    - name: Log in to Docker Hub
      community.general.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"  # Use environment variable for password
        reauthorize: yes
  # tasks:
  #   - name: Log in to Docker Hub
  #     community.general.docker_login:
  #       username: "{{ docker_registry_username }}"
  #       password: "{{ docker_registry_password }}"  # Use environment variable for password
  #       reauthorize: yes

    - name: Build Docker image
      community.docker.docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        state: present

    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        push: yes
        source: local

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: deployment.yaml
        kubeconfig: config

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: service.yaml
        kubeconfig: config
